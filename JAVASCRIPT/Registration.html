<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"
        <title>Javascript Form Validation</title>
        <script src="Bjs.js"></script>
    </head>
    <body onload="document.resgistration.userid.focus();">
        <h1>Registration Form</h1>
        <form name="registration" onsubmit="return formvalidation()">
            <li><lablel for="userid">User id:</lablel></li>
            <li><input type="text" name="userid" size="12"></li>
            <li><lablel for="passid">Password:</lablel></li>
            <li><input type="password" name="passid" size="12">U</li>
            <li><lablel for="username">Name:</lablel></li>
            <li><input type="text" name="username" size="50"></li>
            <li><lablel for="Address">Name:</lablel></li>
            <li><input type="text" name="address" size="50"></li>
            <li><lablel for="country">Country</lablel></li>
            <li><select name="country">
                <option selected="" value="Default">(please select a country)</option>
            
            <option value="AF">Australia</option>
            <option value="AL">Canada</option>
            <option value="DZ">India</option>
            <option value="AS">Russia</option>
            <option value="AD">USA</option>
        </select></li>
        <li><label for="zip">Zip code</label></li>
        <li><input type="text" name="zip"></li>
         <li><label for="email">Email:</label></li>
         <li><input type="text" name="zip"></li>
        </form>
    </body>
</html>
